version: '3.8'

services:
  nitrosniper:
    build: .
    container_name: nitrosniper
    environment:
      - TZ=UTC
    volumes:
      - ./settings.json:/app/settings.json:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - sniper-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  sniper-network:
    driver: bridge
